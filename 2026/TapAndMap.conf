# This is the config file that the TapAndMap services read.  Its function is to put all the
# user-defined values in one easy place so that changes can be implemented quickly.
# Braces are used to define values that TapAndMap will read in.
# Both services re-read this file on their own -- no restart needed after an edit.

# HomeLat and HomeLong are YOUR coordinates.  Used to draw the lines to/from the right place and to centre the map.
# (Right-click your house on https://www.openstreetmap.org and choose "Show address" to get them.)
HomeLat={39.8283}
HomeLong={-98.5795}

# The Pi's own IP address (eth0).  The Pi's own clock-sync (NTP) traffic is ignored so it doesn't clutter the map.
TapAndMapIP={192.168.1.50}

# The NIC plugged into the mirror port / tap (optional, eth1 if left out)
SniffInterface={eth1}

# Zoom level the map opens at (Leaflet/OpenStreetMap zoom, 2-19).  3 shows a continent, 2 the whole world.
ZoomLevel={3}

# Font size for the right-hand pane, in percent (75-95 seems good)
FontSize={75}

# Number of packet lines shown in the right-hand pane (46 seems good)
PacketLine={46}

# Milliseconds between page refreshes (200 is snappy, 1000 is gentler on old Pis)
RefreshRate={1000}

# Minutes in each saved log / saved map (1440 = one per day, 60 = hourly)
LogRun={1440}

# This is probably the biggie... a list of IP addresses which TapAndMap will ignore.  The code checks
# for 'starts with,' so enter the quads to ignore from left to right, each separated by a space.
# "10." ignores 10.x.x.x, "20.12.23" ignores 20.12.23.x, "8.8.8.8" ignores just that host.
IgnoreIPs={10. 169.254. 192.168. 172.16. 0. 223. 224. 225. 226. 227. 228. 229. 230. 231. 232. 233. 234. 235. 236. 237. 238. 239. 240. 255.}
